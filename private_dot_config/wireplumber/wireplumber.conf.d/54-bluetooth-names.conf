# Human-readable display names (description/nick) for Bluetooth devices.
# Internal device.name/node.name are left at their standard values.
# Sink, source and the always-present virtual mic (bluez loopback) take their
# descriptions from device.description, so one device rule covers them all.
# Matched on device.name (contains the MAC address) so it only hits the device,
# not its nodes, which share api.bluez5.address.

monitor.bluez.rules = [
  {
    matches = [ { device.name = "bluez_card.80_99_E7_4D_52_DD" } ]
    actions = { update-props = {
      device.description = "Sony WH-1000XM4"
      device.nick        = "Sony WH-1000XM4"
    } }
  }
]
