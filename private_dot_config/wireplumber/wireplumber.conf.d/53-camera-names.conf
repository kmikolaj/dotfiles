# Human-readable display names (description/nick) for the built-in HP 5MP
# Camera module. Internal device.name/node.name are left at their standard
# values.
# The USB module holds two cameras (colour + infrared); each also exposes a
# metadata-only device with no video, which is hidden here.
# Devices are matched on their USB interface (device.bus-path) and capture
# capability: each camera shares its device.name with its metadata device until
# duplicate-name handling adds ".2", so device.name alone can't tell them apart
# when the metadata rule runs. (api.v4l2.cap.* would be nicer but is only
# filled in after the rules run.)
# Nodes are matched on the description WirePlumber derives from the device.

monitor.v4l2.rules = [
  # --- Colour camera ---
  {
    matches = [ {
      device.bus-path = "pci-0000:c3:00.4-usb-0:1:1.0"
      device.capabilities = ":capture:"
    } ]
    actions = { update-props = {
      device.description = "Webcam"
      device.nick        = "Webcam"
    } }
  }
  {
    matches = [ { node.description = "Webcam (V4L2)" } ]
    actions = { update-props = {
      node.description = "Webcam"
      node.nick        = "Webcam"
    } }
  }

  # --- Infrared camera (face unlock) ---
  {
    matches = [ {
      device.bus-path = "pci-0000:c3:00.4-usb-0:1:1.2"
      device.capabilities = ":capture:"
    } ]
    actions = { update-props = {
      device.description = "IR Camera"
      device.nick        = "IR Camera"
    } }
  }
  {
    matches = [ { node.description = "IR Camera (V4L2)" } ]
    actions = { update-props = {
      node.description = "IR Camera"
      node.nick        = "IR Camera"
    } }
  }

  # --- Metadata-only devices (no video): hide ---
  {
    matches = [
      { device.bus-path = "pci-0000:c3:00.4-usb-0:1:1.0", device.capabilities = ":" }
      { device.bus-path = "pci-0000:c3:00.4-usb-0:1:1.2", device.capabilities = ":" }
    ]
    actions = { update-props = {
      device.disabled = true
    } }
  }
]
