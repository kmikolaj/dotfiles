# Human-readable display names (description/nick) for sound cards and their
# sinks/sources. Internal device.name/node.name are left at their standard
# values so scripts, saved state, docs and bug reports keep matching.

monitor.alsa.rules = [
  # --- Internal laptop audio (Ryzen HD Audio Controller, ALC245 codec) ---
  {
    matches = [ { device.name = "alsa_card.pci-0000_c3_00.6" } ]
    actions = { update-props = {
      device.description = "Laptop Audio"
      device.nick        = "Laptop"
    } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_c3_00.6.analog-stereo" } ]
    actions = { update-props = {
      node.description = "Laptop Output"
      node.nick        = "Laptop Output"
    } }
  }
  {
    matches = [ { node.name = "alsa_input.pci-0000_c3_00.6.analog-stereo" } ]
    actions = { update-props = {
      node.description = "Laptop Input"
      node.nick        = "Laptop Input"
    } }
  }

  # --- HDMI / DisplayPort audio (Radeon GPU) ---
  {
    matches = [ { device.name = "alsa_card.pci-0000_c3_00.1" } ]
    actions = { update-props = {
      device.description = "HDMI / DisplayPort Audio"
      device.nick        = "HDMI"
    } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_c3_00.1.hdmi-stereo" } ]
    actions = { update-props = {
      node.description = "HDMI 1"
      node.nick        = "HDMI 1"
    } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_c3_00.1.hdmi-surround" } ]
    actions = { update-props = {
      node.description = "HDMI 1 (5.1)"
      node.nick        = "HDMI 1 (5.1)"
    } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_c3_00.1.hdmi-surround71" } ]
    actions = { update-props = {
      node.description = "HDMI 1 (7.1)"
      node.nick        = "HDMI 1 (7.1)"
    } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_c3_00.1.hdmi-stereo-extra1" } ]
    actions = { update-props = {
      node.description = "HDMI 2"
      node.nick        = "HDMI 2"
    } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_c3_00.1.hdmi-surround-extra1" } ]
    actions = { update-props = {
      node.description = "HDMI 2 (5.1)"
      node.nick        = "HDMI 2 (5.1)"
    } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_c3_00.1.hdmi-surround71-extra1" } ]
    actions = { update-props = {
      node.description = "HDMI 2 (7.1)"
      node.nick        = "HDMI 2 (7.1)"
    } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_c3_00.1.hdmi-stereo-extra2" } ]
    actions = { update-props = {
      node.description = "HDMI 3"
      node.nick        = "HDMI 3"
    } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_c3_00.1.hdmi-surround-extra2" } ]
    actions = { update-props = {
      node.description = "HDMI 3 (5.1)"
      node.nick        = "HDMI 3 (5.1)"
    } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_c3_00.1.hdmi-surround71-extra2" } ]
    actions = { update-props = {
      node.description = "HDMI 3 (7.1)"
      node.nick        = "HDMI 3 (7.1)"
    } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_c3_00.1.hdmi-stereo-extra3" } ]
    actions = { update-props = {
      node.description = "HDMI 4"
      node.nick        = "HDMI 4"
    } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_c3_00.1.hdmi-surround-extra3" } ]
    actions = { update-props = {
      node.description = "HDMI 4 (5.1)"
      node.nick        = "HDMI 4 (5.1)"
    } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_c3_00.1.hdmi-surround71-extra3" } ]
    actions = { update-props = {
      node.description = "HDMI 4 (7.1)"
      node.nick        = "HDMI 4 (7.1)"
    } }
  }
]
