# hardware decoding
hwdec=vaapi

# enabled codecs
hwdec-codecs=h264,hevc,vp9,av1

# video output
vo=gpu-next

# profile
#profile=fast

# scaling quality
#scale=lanczos
#cscale=lanczos

# audio output: use pulse because pipewire ao-volume is broken
#ao=pipewire
ao=pulse

# audio channel layout
audio-channels=auto-safe

# no-video when playing audio file
audio-display=no

# do not disable compositor (X11)
x11-bypass-compositor=no

# subrip subtitles
sub-auto=fuzzy
#sub-codepage=enca:pl:cp1250
sub-codepage=cp1250
sub-font="MetaPro Medium"
sub-font-size=60
sub-shadow-offset=0
sub-border-size=2.4
subs-with-matching-audio=yes
# use script findsrt
#sub-file-paths=sub:subs:subtitles:Sub:Subs:Subtitles

# fonts
embeddedfonts=no
sub-scale-with-window=yes
sub-scale-by-window=yes

# ass subtitles
sub-ass-override=force
sub-ass-scale-with-window=yes
sub-ass-force-margins=yes

# OSD
osd-bar=yes
osd-font-size=30
osd-bar-align-x=0
osd-bar-align-y=0
osd-bar-border-size=1

# languages
alang=pol,pl,eng,en
slang=pol,pl,eng,en

# save
#save-position-on-quit

# watch-later directory
watch-later-dir=~/.cache/mpv/watch-later

# screenshots directory
screenshot-dir=~/.cache/mpv/screenshots

# per-file config
use-filedir-conf=yes

# cache: mpv enables it automatically for URLs and network filesystems (NFS/SMB)
demuxer-max-bytes=600MiB
demuxer-max-back-bytes=150MiB
stream-buffer-size=4096KiB

[norm]
profile-desc="Loudness normalization: even volume, reduced dynamic range"
af=lavfi=[loudnorm=I=-23:TP=-2:LRA=8,aresample=48000]

[night]
profile-desc="Night mode: level dialogue and loud scenes"
af=lavfi=[dynaudnorm=f=150:g=15:p=0.5:m=10]

[webm-extension]
profile-cond=get('filename', ''):match('%.webm$') ~= nil
profile-restore=copy
hr-seek=yes
